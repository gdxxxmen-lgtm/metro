<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資訊物品點交系統</title>
    <meta name="robots" content="noindex, nofollow">
    <!-- 外部套件：優先讀取同資料夾 libs/ 內的本機檔（可離線），找不到才改用「鎖定版本」的 CDN -->
    <script src="libs/tailwind.js"></script>
    <script>window.tailwind || document.write('<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>')</script>
    <script src="libs/lucide.min.js"></script>
    <script>window.lucide || document.write('<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"><\/script>')</script>
    <script src="libs/xlsx.full.min.js"></script>
    <script>window.XLSX || document.write('<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"><\/script>')</script>
    <script src="libs/html5-qrcode.min.js"></script>
    <script>window.Html5Qrcode || document.write('<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>')</script>
    <script src="libs/exceljs.min.js"></script>
    <script>window.ExcelJS || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"><\/script>')</script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 0; }
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: white; }
        .app-content { display: none; }
        #signatureCanvas { border: 2px dashed #cbd5e1; border-radius: 8px; width: 100%; height: 200px; touch-action: none; background: #fff; }
        .remark-tag { display: inline-flex; align-items: center; background: #e0f2fe; color: #0284c7; padding: 4px 10px; border-radius: 999px; font-size: 13px; margin: 2px; cursor: pointer; transition: 0.2s; }
        .remark-tag:hover { background: #fee2e2; color: #ef4444; }
        .remark-option { border: 2px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .remark-option.selected { border-color: #3b82f6; background-color: #eff6ff; }
        .number-input { width: 60px; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; }
        #scanner-container { width: 100%; max-width: 400px; margin: 0 auto; }
    </style>
</head>
<body>

    <!-- 前端密碼鎖畫面 -->
    <div id="lockScreen">
        <i data-lucide="lock" class="w-16 h-16 mb-4 text-blue-400"></i>
        <h1 class="text-2xl font-bold mb-6">資訊物品點交系統</h1>
        <input type="password" id="passwordInput" placeholder="請輸入進入密碼" class="px-4 py-3 rounded-lg text-gray-800 w-64 mb-4 text-center text-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onkeydown="if(event.key==='Enter') checkPassword()">
        <button onclick="checkPassword()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-lg font-bold transition">解鎖進入</button>
        <p id="passwordError" class="text-red-400 mt-4 hidden">密碼錯誤，請重新輸入</p>
    </div>

    <!-- 系統主體 -->
    <div id="mainApp" class="app-content min-h-screen">
        <header class="bg-white shadow-sm px-4 md:px-6 py-4 flex justify-between items-center sticky top-0 z-10">
            <div>
                <h1 class="text-lg md:text-xl font-bold text-gray-800 tracking-wide">資訊物品點交系統</h1>
                <p id="versionDisplay" class="text-xs font-bold text-blue-600 mt-1">無暫存資料，請匯入 Excel</p>
            </div>
            <div class="relative">
                <button onclick="toggleMenu()" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                    <i data-lucide="settings" class="w-5 h-5 text-gray-600"></i>
                </button>
                <div id="settingsMenu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-100 rounded-xl shadow-lg py-2 z-20">
                    <label class="block px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer flex items-center">
                        <i data-lucide="upload" class="w-4 h-4 mr-2"></i>重新匯入 Excel
                        <input type="file" id="excelUpload" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
                    </label>
                    <button onclick="exportExcel()" class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 flex items-center">
                        <i data-lucide="download" class="w-4 h-4 mr-2"></i>匯出完成清單
                    </button>
                    <button onclick="clearAllData()" class="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-red-50 flex items-center border-t mt-1">
                        <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i>清除本機資料
                    </button>
                    <button onclick="showRecordModal()" class="w-full text-left px-4 py-3 text-sm text-green-700 hover:bg-green-50 flex items-center border-t mt-1">
                        <i data-lucide="clipboard-list" class="w-4 h-4 mr-2"></i>查詢報廢紀錄
                    </button>
                </div>
            </div>
        </header>

        <main class="p-4 md:p-6 max-w-7xl mx-auto">
            <!-- NFC 控制區 -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 md:p-6 mb-4 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <div class="w-12 h-12 rounded-full bg-green-50 flex-shrink-0 flex items-center justify-center">
                        <i data-lucide="nfc" class="w-6 h-6 text-green-600"></i>
                    </div>
                    <div>
                        <h2 class="text-base md:text-lg font-bold text-gray-800">NFC 卡片登記</h2>
                        <p class="text-xs md:text-sm text-gray-500">請啟動並感應卡片，卡號將綁定至後續報廢項目。</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                    <div class="bg-gray-50 px-3 py-2 rounded-lg border border-gray-200">
                        <span class="text-[10px] md:text-xs text-gray-500 block">目前讀取卡號</span>
                        <span id="nfc-card-id" class="font-mono font-bold text-gray-800 text-sm">尚未讀取</span>
                    </div>
                    <button id="startNfcBtn" class="px-4 py-3 bg-gray-800 hover:bg-gray-900 text-white rounded-xl font-bold shadow-md transition flex items-center gap-2 whitespace-nowrap">
                        <i data-lucide="wifi" class="w-4 h-4"></i>啟動
                    </button>
                </div>
            </div>

            <!-- 清單區塊 -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-4 md:p-6 border-b border-gray-100 bg-gray-50 flex flex-col gap-4">
                    <div class="flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
                        <h3 class="font-bold text-gray-800 flex items-center whitespace-nowrap">
                            <i data-lucide="list" class="w-5 h-5 mr-2 text-gray-400"></i>
                            待處理物品清單
                        </h3>
                        <div class="flex gap-2 w-full md:w-auto">
                            <div class="relative flex-1 md:flex-none">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                                <input type="text" id="searchInput" placeholder="搜尋編號、名稱或保管人..." class="pl-9 pr-4 py-2 border rounded-lg text-sm w-full md:w-64 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            </div>
                            <button onclick="startCameraScanner()" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1 transition whitespace-nowrap flex-shrink-0">
                                <i data-lucide="camera" class="w-4 h-4"></i> 掃條碼
                            </button>
                        </div>
                    </div>
                    <!-- 處室與細項篩選 -->
                    <div class="flex flex-col md:flex-row gap-2 w-full">
                        <select id="deptFilter" onchange="updateSubDeptFilter()" class="border border-gray-300 rounded-lg text-sm px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white font-bold text-gray-700 flex-1 md:flex-none md:w-56">
                            <option value="">🏢 所有處室單位</option>
                        </select>
                        <select id="subDeptFilter" onchange="renderTable()" class="hidden border border-gray-300 rounded-lg text-sm px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white text-gray-700 flex-1">
                            <option value="">📁 所有組/課/中心細項</option>
                        </select>
                    </div>
                </div>

                <!-- 狀態列與篩選下拉選單 (紅色標記區域整合) -->
                <div class="p-4 bg-white border-b border-gray-100 flex flex-wrap gap-3 items-center">
                    <span class="bg-gray-100 text-gray-700 px-3 py-2 rounded-lg text-sm font-bold whitespace-nowrap">已選 <span id="selectedCount">0</span> 筆</span>
                    <button id="viewSelectedBtn" class="border border-green-200 text-green-700 bg-green-50 px-3 py-2 rounded-lg text-sm font-bold hover:bg-green-100 transition flex items-center gap-1 whitespace-nowrap">
                        <i data-lucide="check-square" class="w-4 h-4"></i> 檢視已選
                    </button>
                    
                    <!-- 新增：已報廢 / 未報廢 狀態下拉選單 -->
                    <select id="statusFilter" onchange="renderTable()" class="border border-gray-300 bg-gray-50 text-gray-700 px-3 py-2 rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                        <option value="all">📋 全部狀態</option>
                        <option value="pending">⏳ 未報廢 (待處理)</option>
                        <option value="completed">✅ 已報廢 (已完成)</option>
                    </select>

                    <button id="actionBtn" class="hidden px-5 py-2 rounded-lg text-sm font-bold text-white shadow-md transition ml-auto flex items-center gap-2 whitespace-nowrap">
                    </button>
                </div>

                <div class="overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse min-w-[800px]">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-sm border-b">
                                <th class="p-4 w-12 text-center">選取</th>
                                <th class="p-4 whitespace-nowrap">物品 / 編號 (G欄)</th>
                                <th class="p-4 whitespace-nowrap">處室 / 單號 (M欄)</th>
                                <th class="p-4 whitespace-nowrap">保管人 / 地點</th>
                                <th class="p-4 whitespace-nowrap w-40">狀態 / NFC卡號</th>
                                <th class="p-4 whitespace-nowrap">備註 / 簽名</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-100 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 相機掃描彈窗 -->
    <div id="scannerModal" class="hidden fixed inset-0 bg-black/60 items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-[90%] max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">相機掃描</h2>
                <button onclick="closeModal('scannerModal')" class="text-gray-400 hover:text-gray-700"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div id="scanner-container" class="rounded-lg overflow-hidden bg-black"></div>
            <p class="text-sm text-gray-500 mt-4 text-center">掃描成功後將自動打勾並加入清單</p>
        </div>
    </div>

    <!-- 簽名彈窗 -->
    <div id="signModal" class="hidden fixed inset-0 bg-black/60 items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-[90%] max-w-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">確認報廢與簽名</h2>
                <button onclick="closeModal('signModal')" class="text-gray-400 hover:text-gray-700"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="mb-4">
                <p class="text-sm text-gray-600 mb-2 font-bold flex justify-between">
                    <span>即將報廢物品：</span>
                    <span id="modalNfcDisplay" class="text-blue-600"></span>
                </p>
                <div id="modalItemsList" class="bg-gray-50 p-3 rounded-lg border text-sm max-h-32 overflow-y-auto"></div>
            </div>
            <div class="flex-1 flex flex-col">
                <div class="flex justify-between items-end mb-2">
                    <p class="text-sm text-gray-600 font-bold">請在下方空白處簽名：</p>
                    <button onclick="clearCanvas()" class="text-red-500 text-sm font-bold hover:underline">清除重簽</button>
                </div>
                <canvas id="signatureCanvas"></canvas>
            </div>
            <button onclick="confirmDisposal()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-lg">
                確認儲存
            </button>
        </div>
    </div>

    <!-- 備註彈窗 -->
    <div id="remarkModal" class="hidden fixed inset-0 bg-black/60 items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-[90%] max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">新增備註狀態</h2>
                <button onclick="closeModal('remarkModal')" class="text-gray-400 hover:text-gray-700"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="space-y-3 mb-6">
                <div class="remark-option" id="opt-power" onclick="toggleOption('opt-power')">
                    <span class="font-bold text-gray-700">缺電源線</span>
                    <input type="number" id="qty-power" value="1" min="1" class="number-input" onclick="event.stopPropagation()">
                </div>
                <div class="remark-option" id="opt-cable" onclick="toggleOption('opt-cable')">
                    <span class="font-bold text-gray-700">缺傳輸線</span>
                    <input type="number" id="qty-cable" value="1" min="1" class="number-input" onclick="event.stopPropagation()">
                </div>
                <div class="remark-option" id="opt-broken" onclick="toggleOption('opt-broken')">
                    <span class="font-bold text-gray-700">設備損毀</span>
                </div>
            </div>
            <div class="mb-6">
                <p class="text-sm text-gray-600 mb-2 font-bold">其他狀況說明</p>
                <textarea id="customRemark" rows="2" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="請輸入其他備註事項..."></textarea>
            </div>
            <button id="confirmRemarkBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">確認新增</button>
        </div>
    </div>

    <!-- 紀錄查詢彈窗 -->
    <div id="recordModal" class="hidden fixed inset-0 bg-black/60 items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-4 md:p-6 w-[95%] max-w-4xl shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">已完成報廢紀錄</h2>
                <button onclick="closeModal('recordModal')" class="text-gray-400 hover:text-gray-700"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="overflow-x-auto border rounded-lg flex-1">
                <table class="w-full text-left text-sm min-w-[700px]">
                    <thead class="bg-gray-50 text-gray-500 sticky top-0 shadow-sm">
                        <tr>
                            <th class="p-3 whitespace-nowrap">時間 / 卡號</th>
                            <th class="p-3 whitespace-nowrap">單號</th>
                            <th class="p-3 whitespace-nowrap">物品 / 編號</th>
                            <th class="p-3 whitespace-nowrap">保管單位 / 保管人</th>
                            <th class="p-3 whitespace-nowrap">簽名檔案</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody" class="divide-y divide-gray-100 bg-white"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const APP_PASSWORD = "8888";
        const ADMIN_PASSWORD = "1234"; // 退回待處理、清除本機資料共用
        const AUTH_EXPIRY_MS = 3 * 60 * 60 * 1000;

        let data = [];
        let signatures = {}; // 簽名圖檔（同一批次共用一張，避免重複佔用空間）
        let importVersion = "";
        let currentNfcCard = "";
        let selectedIds = new Set();
        let uniqueDepts = {};
        let currentRemarkItemId = null;
        let viewOnlySelected = false;
        let html5QrcodeScanner = null;
        let nfcScanning = false;
        let rawHeaders = []; // 原始 Excel 標題列（匯出時帶回所有原欄位）

        // --- 登入驗證 (3小時免登) ---
        window.onload = () => {
            const authExpiry = localStorage.getItem('authExpiry');
            if (authExpiry && Date.now() < parseInt(authExpiry)) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                loadData();
            }
        };

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            if(input === APP_PASSWORD) {
                localStorage.setItem('authExpiry', Date.now() + AUTH_EXPIRY_MS);
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                loadData();
            } else {
                document.getElementById('passwordError').style.display = 'block';
            }
        }

        // --- 本機儲存 ---
        function getSign(item) { return item.signImg || signatures[item.signId] || ''; }
        function cleanupSignatures() {
            const used = new Set(data.map(d => d.signId).filter(Boolean));
            Object.keys(signatures).forEach(k => { if (!used.has(k)) delete signatures[k]; });
        }
        function esc(v) {
            return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function saveData() {
            try {
                localStorage.setItem('inventoryData', JSON.stringify(data));
                localStorage.setItem('signatures', JSON.stringify(signatures));
                localStorage.setItem('rawHeaders', JSON.stringify(rawHeaders));
                localStorage.setItem('importVersion', importVersion);
                return true;
            } catch(e) {
                console.error("儲存失敗", e);
                alert("⚠️ 本機儲存失敗（可能空間已滿）！請立即「匯出完成清單」備份，以免資料遺失。");
                return false;
            }
        }

        function loadData() {
            const stored = localStorage.getItem('inventoryData');
            try { signatures = JSON.parse(localStorage.getItem('signatures') || '{}'); } catch(e) { signatures = {}; }
            try { rawHeaders = JSON.parse(localStorage.getItem('rawHeaders') || '[]'); } catch(e) { rawHeaders = []; }
            if (stored) {
                data = JSON.parse(stored);
                importVersion = localStorage.getItem('importVersion') || "";
                if(importVersion) document.getElementById('versionDisplay').textContent = "資料版本: " + importVersion;
                buildDeptFilters();
                renderTable();
            } else {
                document.getElementById('versionDisplay').textContent = "無暫存資料，請匯入 Excel";
                renderTable();
            }
        }

        function clearAllData() {
            const pw = prompt("請輸入管理密碼以清除本機資料：");
            if (pw === null) return;
            if (pw !== ADMIN_PASSWORD) { alert("密碼錯誤，已取消清除。"); return; }
            if(confirm("確定要刪除平板上的所有本機資料嗎？刪除後無法復原。")) {
                localStorage.removeItem('inventoryData');
                localStorage.removeItem('importVersion');
                localStorage.removeItem('signatures'); signatures = {};
                localStorage.removeItem('rawHeaders'); rawHeaders = [];
                data = []; importVersion = ""; selectedIds.clear();
                document.getElementById('versionDisplay').textContent = "無暫存資料，請匯入 Excel";
                toggleMenu(); buildDeptFilters(); renderTable(); updateActionUI();
                alert("本機資料已清除完畢！");
            }
        }

        // --- 處室與細項智慧下拉選單 (M欄) ---
        function buildDeptFilters() {
            uniqueDepts = {};
            data.forEach(item => {
                if(!item.保管單位) return;
                const fullDept = item.保管單位;
                // 先抓第一個「處、廠、中心、室」當作一級處室（例如：人力資源處、電機處）
                const match = fullDept.match(/^.*?(處|廠|中心|室)/);
                const mainDept = match ? match[0] : fullDept;
                if (!uniqueDepts[mainDept]) uniqueDepts[mainDept] = new Set();
                uniqueDepts[mainDept].add(fullDept);
            });
            const deptSelect = document.getElementById('deptFilter');
            deptSelect.innerHTML = '<option value="">🏢 所有處室單位</option>';
            Object.keys(uniqueDepts).sort().forEach(dept => {
                deptSelect.innerHTML += `<option value="${esc(dept)}">${esc(dept)}</option>`;
            });
            updateSubDeptFilter();
        }

        function updateSubDeptFilter() {
            const dept = document.getElementById('deptFilter').value;
            const subSelect = document.getElementById('subDeptFilter');
            subSelect.innerHTML = '<option value="">📁 所有組/課/中心細項</option>';
            if (dept && uniqueDepts[dept]) {
                const subList = Array.from(uniqueDepts[dept]).sort();
                // 只有當該處室底下有更細的組/課（或多種子單位）時才顯示細項選單
                if (subList.length > 1 || (subList.length === 1 && subList[0] !== dept)) {
                    subList.forEach(sub => {
                        const shortName = sub.startsWith(dept) && sub !== dept ? `${sub} (${sub.slice(dept.length)})` : sub;
                        subSelect.innerHTML += `<option value="${esc(sub)}">${esc(shortName)}</option>`;
                    });
                    subSelect.classList.remove('hidden');
                } else {
                    subSelect.classList.add('hidden');
                }
            } else {
                subSelect.classList.add('hidden');
            }
            renderTable();
        }

        // --- Modal 控制 ---
        function openModal(id) {
            const el = document.getElementById(id);

        // --- 相機掃描 ---
        function startCameraScanner() {

        // 取得一級處室（與上方處室下拉選單同一套規則）
        function getMainDept(fullDept) {
            if (!fullDept) return '(未填保管單位)';
            const m = fullDept.match(/^.*?(處|廠|中心|室)/);
            return m ? m[0] : fullDept;
        }

        // 嘗試選取：已選項目屬於不同處室時拒絕，回傳是否成功
        function trySelect(id) {
            if (selectedIds.has(id)) return true;
            const item = data.find(d => d.id === id);
            if (!item) return false;
            if (selectedIds.size > 0) {
                const firstId = selectedIds.values().next().value;
                const first = data.find(d => d.id === firstId);
                const curDept = first ? getMainDept(first.保管單位) : '';
                const newDept = getMainDept(item.保管單位);
                if (first && curDept !== newDept) {
                    alert(`⚠️ 不同處室無法一起報廢！\n\n目前已選：${curDept}\n此物品屬於：${newDept}\n\n請先完成或取消已選項目，再處理其他處室。`);
                    return false;
                }
            }
            selectedIds.add(id);
            return true;
        }

        function toggleSelect(id) {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else trySelect(id);
            updateActionUI();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');

            const selectedMainDept = document.getElementById('deptFilter').value;
            const selectedSubDept = document.getElementById('subDeptFilter').value;

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">尚無資料，請點擊右上角齒輪匯入 Excel</td></tr>`;
                return;
            }

            let filteredData = data.filter(item => {
                // 1. 檢視已選過濾
                if (viewOnlySelected && !selectedIds.has(item.id)) return false;
                // 2. 已報廢 / 未報廢 下拉選單過濾
                if (statusFilterVal !== 'all' && item.status !== statusFilterVal) return false;
                // 3. 處室與細項過濾

                    if (!item.保管單位.startsWith(selectedMainDept)) return false;
                }
                // 4. 關鍵字搜尋 (編號、名稱、保管人、單號)
                if (!search) return true;
                return item.物品編號.toLowerCase().includes(search) ||
                       item.物品名稱.toLowerCase().includes(search) ||
                       item.保管人.toLowerCase().includes(search) ||
                       item.報廢單號.toLowerCase().includes(search);

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">沒有符合篩選條件的物品</td></tr>`;

            filteredData.forEach(item => {

                const sg = getSign(item);
                let signHtml = sg ? `<img src="${sg}" class="h-10 border rounded bg-white object-contain inline-block ml-2 mt-1">` : '';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition cursor-pointer';
                tr.onclick = (e) => {
                    if (!e.target.closest('input') && !e.target.closest('button') && !e.target.closest('.remark-tag')) {
                        toggleSelect(item.id);
                        const chk = document.getElementById(`chk-${item.id}`);

                tr.innerHTML = `
                    <td class="p-4 text-center"><input type="checkbox" id="chk-${item.id}" class="w-5 h-5 text-blue-600 rounded cursor-pointer" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleSelect(${item.id}); this.checked = selectedIds.has(${item.id})"></td>
                    <td class="p-4 whitespace-nowrap"><div class="font-bold text-gray-800">${esc(item.物品名稱)}</div><div class="text-xs text-gray-500 font-mono">${esc(item.物品編號)}</div></td>
                    <td class="p-4 whitespace-nowrap"><div class="text-gray-800 font-medium">${esc(item.保管單位)}</div><div class="text-xs text-gray-500 font-mono">${esc(item.報廢單號 || '無單號')}</div></td>
                    <td class="p-4 whitespace-nowrap"><div class="font-bold text-gray-800">${esc(item.保管人)}</div><div class="text-xs text-gray-500">${esc(item.存置地點)}</div></td>

        // --- 畫布簽名 ---
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let hasSigned = false;
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.offsetWidth * dpr;
            canvas.height = canvas.offsetHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        function canvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
            const p = canvasPos(e);
            ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000';
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.01, p.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(p.x, p.y);
            hasSigned = true;
        }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const p = canvasPos(e);
            ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x, p.y);
        }
        function stopDrawing() { isDrawing = false; ctx.beginPath(); }
        canvas.addEventListener('pointerdown', startDrawing);
        canvas.addEventListener('pointermove', draw);
        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointercancel', stopDrawing);
        function clearCanvas() {
            ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.restore(); hasSigned = false;
        }
        // 輸出簽名：白底 PNG（原本 JPEG 會把透明背景變成黑色，簽名會整張變黑）
        function getSignatureImage() {
            const W = 480, H = 160;
            const out = document.createElement('canvas'); out.width = W; out.height = H;
            const c = out.getContext('2d');
            c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
            const scale = Math.min(W / canvas.width, H / canvas.height);
            const w = canvas.width * scale, h = canvas.height * scale;
            c.drawImage(canvas, (W - w) / 2, (H - h) / 2, w, h);
            return out.toDataURL('image/png');
        }
        function getFormattedTime() {
            const now = new Date();
            const p = n => String(n).padStart(2, '0');
            return now.getFullYear() + "-" + p(now.getMonth()+1) + "-" + p(now.getDate()) + " " + p(now.getHours()) + ":" + p(now.getMinutes()) + ":" + p(now.getSeconds());
        }

        function openSignModal() {
            const pendingIds = Array.from(selectedIds).filter(id => {
                const it = data.find(d => d.id === id);
                return it && it.status !== 'completed';
            });
            if (pendingIds.length === 0) return;
            const skipped = selectedIds.size - pendingIds.length;
            const depts = new Set(pendingIds.map(id => getMainDept(data.find(d => d.id === id).保管單位)));
            if (depts.size > 1) {
                alert("已選項目包含不同處室，無法一起報廢，請重新選取。");
                return;
            }
            openModal('signModal');
            resizeCanvas();
            clearCanvas();
            document.getElementById('modalNfcDisplay').textContent = currentNfcCard ? `綁定卡號: ${currentNfcCard}` : '(無 NFC 綁定)';
            document.getElementById('modalItemsList').innerHTML = `<div class="font-bold text-gray-700 mb-1">處室：${esc(Array.from(depts)[0])}</div>` + pendingIds.map(id => {
                const item = data.find(d => d.id === id);
                return `<div>• ${esc(item.物品名稱)} <span class="text-gray-400 font-mono">(${esc(item.物品編號)})</span></div>`;
            }).join('') + (skipped ? `<div class="text-amber-600 mt-1">※ 已略過 ${skipped} 筆「已完成」的項目</div>` : '');
        }

        function resetNfcCard() {
            currentNfcCard = '';
            nfcDisplay.textContent = '尚未讀取';
            nfcDisplay.classList.remove('text-green-600');
            startNfcBtn.innerHTML = nfcScanning
                ? '<i data-lucide="wifi" class="w-4 h-4"></i>等待感應'
                : '<i data-lucide="wifi" class="w-4 h-4"></i>啟動';
            lucide.createIcons();
        }

        function confirmDisposal() {
            if (!hasSigned) { alert("請先簽名再儲存。"); return; }
            if (!currentNfcCard && !confirm("尚未感應 NFC 卡片，確定要在沒有卡號的情況下儲存嗎？")) return;
            const pendingItems = Array.from(selectedIds).map(id => data.find(d => d.id === id)).filter(it => it && it.status !== 'completed');
            if (pendingItems.length === 0) { closeModal('signModal'); return; }
            const signId = 'sig_' + Date.now();
            signatures[signId] = getSignatureImage();
            const currentTime = getFormattedTime();
            pendingItems.forEach(item => {
                item.status = 'completed';
                item.signId = signId;
                item.signImg = '';
                item.date = currentTime;
                item.nfcCard = currentNfcCard;
            });
            selectedIds.clear(); closeModal('signModal'); saveData();
            document.getElementById('searchInput').value = ''; // 清掉掃條碼帶入的編號
            if (viewOnlySelected) document.getElementById('viewSelectedBtn').click(); // 關閉「檢視已選」，避免清單變空
            renderTable(); updateActionUI();
            resetNfcCard(); // 每批儲存後清空卡號，下一批須重新感應
        }

        // --- 備註 ---
        function openRemarkModalHandler(id) {
            currentRemarkItemId = id; openModal('remarkModal');
            ['opt-power', 'opt-cable', 'opt-broken'].forEach(opt => document.getElementById(opt).classList.remove('selected'));

        }
        function toggleOption(id) { document.getElementById(id).classList.toggle('selected'); }
        document.getElementById('confirmRemarkBtn').addEventListener('click', () => {
            if (!currentRemarkItemId) return;
            const item = data.find(d => d.id === currentRemarkItemId);

        function removeRemark(itemId, remarkIndex) {
            const item = data.find(d => d.id === itemId);

        }

        // --- Excel 匯入 (精準鎖定 G欄、M欄、O欄、Q欄，絕不誤抓代碼與員編) ---
        function cleanStr(val) {
            if (val === undefined || val === null) return '';
            const s = String(val).trim();
            return (s === 'nan' || s === 'NaN' || s === 'undefined') ? '' : s;
        }

        function normRaw(v, header) {
            if (v instanceof Date) {
                const d = new Date(v.getTime() + 12 * 3600 * 1000); // 補償 SheetJS 日期的時區誤差
                return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
            }
            if (typeof v === 'number' && /日期/.test(header) && v > 20000 && v < 80000) {
                const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000);
                return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,'0') + "-" + String(d.getUTCDate()).padStart(2,'0');
            }
            if (typeof v === 'string') return v.trim();
            return v === undefined || v === null ? '' : v;
        }

        function importExcel(e) {
            const file = e.target.files[0]; if (!file) return;
            const doneCount = data.filter(d => d.status === 'completed').length;
            if (doneCount > 0 && !confirm(`目前已有 ${doneCount} 筆完成報廢紀錄（含簽名），重新匯入會全部覆蓋清除。\n建議先「匯出完成清單」備份，確定要繼續匯入嗎？`)) {
                document.getElementById('excelUpload').value = ""; return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                const workbook = XLSX.read(new Uint8Array(evt.target.result), {type: 'array', cellDates: true});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                // 使用 header: 1 直接取得二維陣列，精準對應 Excel 的 A~T 欄位座標
                const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ''});
                if (rows.length < 2) { alert("Excel 檔案無資料！"); return; }

                // 尋找標題列 (第 0 列)
                const headers = rows[0].map(h => cleanStr(h));
                
                // 精確定位各欄位索引 (優先找精準名稱，若無則對準固定欄位座標 G=6, M=12, O=14, Q=16)
                const idxOrderNo = headers.findIndex(h => h === '報廢單號') !== -1 ? headers.findIndex(h => h === '報廢單號') : 0;
                // G欄是第2個「物品編號」(索引6)
                let idxItemId = 6;
                headers.forEach((h, i) => { if (h === '物品編號') idxItemId = i; });
                
                const idxItemName = headers.findIndex(h => h === '物品名稱') !== -1 ? headers.findIndex(h => h === '物品名稱') : 7;
                const idxDept = headers.findIndex(h => h === '保管單位') !== -1 ? headers.findIndex(h => h === '保管單位') : 12; // M欄 (排除「保管單位代碼」)
                const idxKeeper = headers.findIndex(h => h === '保管人') !== -1 ? headers.findIndex(h => h === '保管人') : 14; // O欄 (排除「保管人員編」)
                const idxLocation = headers.findIndex(h => h === '存置地點') !== -1 ? headers.findIndex(h => h === '存置地點') : 16; // Q欄 (排除「存置地點代碼」)

                const parsedData = [];
                for (let i = 1; i < rows.length; i++) {
                    const r = rows[i];
                    if (!r || r.length === 0) continue;
                    
                    // 取得 G 欄完整物品編號，若該格沒有 '-'，則嘗試掃描整列找帶有 '-' 的編號
                    let itemId = cleanStr(r[idxItemId]);
                    if (!itemId.includes('-')) {
                        const found = r.find(cell => /\d{5,}-\d{3,}/.test(cleanStr(cell)));
                        if (found) itemId = cleanStr(found);
                    }
                    const itemName = cleanStr(r[idxItemName]);
                    if (!itemId && !itemName) continue; // 略過空白列

                    parsedData.push({
                        id: i + 100,
                        報廢單號: cleanStr(r[idxOrderNo]),
                        物品編號: itemId,
                        物品名稱: itemName,
                        保管單位: cleanStr(r[idxDept]),
                        保管人: cleanStr(r[idxKeeper]),
                        存置地點: cleanStr(r[idxLocation]),
                        raw: headers.map((h, ci) => normRaw(r[ci], h)),
                        status: 'pending', signImg: '', date: '', nfcCard: '', remarks: []
                    });
                }
                
                data = parsedData; signatures = {}; rawHeaders = headers.slice();
                importVersion = getFormattedTime() + " 匯入";
                document.getElementById('versionDisplay').textContent = "資料版本: " + importVersion;
                selectedIds.clear();
                
                saveData(); buildDeptFilters(); updateActionUI(); renderTable();
                alert(`✅ 成功匯入 ${data.length} 筆資料！`);
                toggleMenu();
                } catch (err) {
                    console.error(err);
                    alert("匯入失敗，請確認檔案是否為正確的 Excel 格式。");
                }
            };
            reader.readAsArrayBuffer(file);
            document.getElementById('excelUpload').value = "";
        }

        // 組合匯出表格：原始 Excel 全部欄位 + 系統新增欄位（含簽名）
        function buildExportTable(done) {
            const legacy = !(rawHeaders.length && done.every(d => Array.isArray(d.raw)));
            const baseHeaders = legacy ? ['報廢單號', '物品編號', '物品名稱', '保管單位', '保管人', '存置地點'] : rawHeaders.slice();
            const headers = baseHeaders.concat(['處理狀態', '報廢完成時間', '綁定卡號', '現場備註事項', '簽名']);
            const rows = done.map(d => {
                const base = legacy
                    ? [d.報廢單號, d.物品編號, d.物品名稱, d.保管單位, d.保管人, d.存置地點]
                    : baseHeaders.map((_, i) => d.raw[i] === undefined ? '' : d.raw[i]);
                return base.concat(['完成報廢', d.date, d.nfcCard, d.remarks.join(', '), '']);
            });
            return { headers, rows, signCol: headers.length - 1 };
        }

        async function exportExcel() {
            const done = data.filter(d => d.status === 'completed');
            if (done.length === 0) { alert("無完成報廢紀錄可匯出！"); return; }
            const fileName = `報廢完成清單_${getFormattedTime().replace(/[-: ]/g, "")}.xlsx`;
            toggleMenu();
            const { headers, rows, signCol } = buildExportTable(done);

            // ExcelJS 載入失敗（例如離線且沒有本機檔）時的備援：不含簽名圖
            if (typeof ExcelJS === 'undefined') {
                const aoa = [headers].concat(rows.map((r, i) => { const c = r.slice(); c[signCol] = getSign(done[i]) ? "（已簽名，圖檔需 ExcelJS 才能匯出）" : "（無簽名）"; return c; }));
                const wbx = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wbx, XLSX.utils.aoa_to_sheet(aoa), "已報廢清單");
                XLSX.writeFile(wbx, fileName);
                alert("⚠️ 無法載入 ExcelJS，本次匯出不含簽名圖片。請參考 libs 資料夾說明放入 exceljs.min.js。");
                return;
            }

            try {
                const wb = new ExcelJS.Workbook();
                const ws = wb.addWorksheet('已報廢清單');
                const head = ws.addRow(headers);
                head.font = { bold: true };
                head.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                head.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE5E7EB' } };
                // 新增欄位的標題換個底色，方便辨識
                for (let c = signCol - 4; c <= signCol + 1; c++) head.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDBEAFE' } };

                done.forEach((d, i) => {
                    const values = rows[i].slice();
                    const img = getSign(d);
                    if (!img) values[signCol] = '（無簽名）';
                    const row = ws.addRow(values);
                    row.height = 45;
                    row.alignment = { vertical: 'middle', wrapText: true };
                    if (img) {
                        const imgId = wb.addImage({ base64: img, extension: img.startsWith('data:image/png') ? 'png' : 'jpeg' });
                        ws.addImage(imgId, { tl: { col: signCol + 0.05, row: row.number - 1 + 0.05 }, ext: { width: 150, height: 50 } });
                    }
                });

                // 欄寬依內容自動調整（上下限 8~40）
                headers.forEach((h, ci) => {
                    let w = String(h).length * 2;
                    rows.forEach(r => { const len = String(r[ci] === undefined || r[ci] === null ? '' : r[ci]).length * 1.6; if (len > w) w = len; });
                    ws.getColumn(ci + 1).width = ci === signCol ? 26 : Math.max(8, Math.min(40, Math.ceil(w)));
                });
                ws.views = [{ state: 'frozen', ySplit: 1 }];

                const buf = await wb.xlsx.writeBuffer();
                const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob); a.download = fileName;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            } catch (err) {
                console.error(err);
                alert("匯出失敗：" + err.message);
            }
        }

        function showRecordModal() {
            toggleMenu(); openModal('recordModal');
            const tbody = document.getElementById('recordTableBody');
            const completed = data.filter(d => d.status === 'completed');
            tbody.innerHTML = completed.length ? completed.map(d => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 whitespace-nowrap"><div class="text-gray-600">${esc(d.date)}</div>${d.nfcCard ? `<div class="text-[10px] text-blue-500 font-mono mt-1">💳 ${esc(d.nfcCard)}</div>` : ''}</td>
                    <td class="p-3 font-mono whitespace-nowrap">${esc(d.報廢單號 || '無單號')}</td>
                    <td class="p-3 whitespace-nowrap">${esc(d.物品名稱)}<br><span class="text-xs text-gray-400 font-mono">${esc(d.物品編號)}</span></td>
                    <td class="p-3 whitespace-nowrap">${esc(d.保管單位)}<br><span class="text-gray-500">${esc(d.保管人)}</span></td>
                    <td class="p-3">${getSign(d) ? `<img src="${getSign(d)}" class="h-12 border bg-white rounded object-contain">` : '<span class="text-gray-300">無圖檔</span>'}</td>
                </tr>
            `).join('') : `<tr><td colspan="5" class="p-6 text-center text-gray-500">尚無已完成報廢的紀錄</td></tr>`;
        }
    </script>
</body>
